[project]
name = "animas-backend"
version = "0.1.0"
description = "FastAPI Sovereign Intelligence Daemon for Ánimas 3D Ofrenda"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "sqlite-vec>=0.1.3",
    "sentence-transformers>=3.0.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
